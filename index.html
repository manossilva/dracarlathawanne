<!DOCTYPE html>
<html lang="pt-BR">
<head>

<style>
/* ============================================================
   TOKENS — paleta derivada da própria foto:
   linho sálvia, joias em latão, pele quente, estúdio porcelana.
   ============================================================ */
:root{
  --porcelain:#FCFAF6;
  --mist:#EFF1EA;
  --ink:#1E231C;
  --ink-soft:#5E6459;
  --ink-faint:#8D9288;
  --sage:#8FA383;
  --sage-deep:#44523B;
  --sage-pale:#E3E9DC;
  --brass:#B08D57;
  --line:rgba(30,35,28,.10);
  --line-strong:rgba(30,35,28,.18);

  --shadow-soft:0 24px 60px -34px rgba(30,35,28,.42);
  --ease:cubic-bezier(.22,.61,.36,1);
  --ease-out:cubic-bezier(.16,1,.3,1);
  --wrap:1160px;

  /* arco do setor de ultrassom — forma-assinatura do site */
  --arch:50% 50% 14px 14px / 40% 40% 3% 3%;
}

*,*::before,*::after{box-sizing:border-box}
html{scroll-behavior:smooth;-webkit-text-size-adjust:100%}
body{
  margin:0;background:var(--porcelain);color:var(--ink);
  font-family:'Manrope',system-ui,sans-serif;font-size:16px;line-height:1.65;
  -webkit-font-smoothing:antialiased;overflow-x:hidden;
}
img{max-width:100%;display:block}
a{color:inherit;text-decoration:none}
button{font-family:inherit;cursor:pointer;color:inherit}
p{margin:0}
ul{margin:0;padding:0;list-style:none}

/* ---- tipografia: duas famílias, hierarquia por peso e itálico ---- */
h1,h2,h3{
  font-family:'Cormorant Garamond',Georgia,serif;font-weight:300;
  line-height:1.08;letter-spacing:-.01em;margin:0;color:var(--ink);
}
h1{font-size:clamp(2.5rem,1.7rem+3.6vw,4.4rem)}
h2{font-size:clamp(2rem,1.5rem+2.2vw,3.2rem)}
h3{font-size:1.28rem;font-weight:400}
.italic{font-style:italic;color:var(--sage-deep)}

.eyebrow{
  display:inline-flex;align-items:center;gap:11px;
  font-size:.7rem;font-weight:600;letter-spacing:.2em;text-transform:uppercase;color:var(--ink-faint);
}
.eyebrow::before{content:'';width:26px;height:1px;background:var(--brass);
  transform:scaleX(0);transform-origin:left;transition:transform .9s .1s var(--ease-out)}
.on .eyebrow::before,.eyebrow.on::before{transform:scaleX(1)}

.wrap{width:100%;max-width:var(--wrap);margin:0 auto;padding:0 22px}
@media(min-width:900px){.wrap{padding:0 44px}}

/* ============================================================
   SISTEMA DE TRANSIÇÃO ENTRE SEÇÕES
   Cada seção entra como um bloco: a faixa de fundo cresce,
   e o conteúdo sobe em cascata por cima dela.
   ============================================================ */
.sec{padding:82px 0;position:relative;isolation:isolate}
@media(min-width:900px){.sec{padding:136px 0}}

/* faixa de fundo que se abre verticalmente na entrada da seção */
.sec--mist::before{
  content:'';position:absolute;inset:0;background:var(--mist);z-index:-1;
  transform:scaleY(.55);transform-origin:center;opacity:0;
  transition:transform 1.1s var(--ease-out),opacity .7s var(--ease-out);
}
.sec--mist.on::before{transform:scaleY(1);opacity:1}

/* cascata: filhos diretos marcados com .stag sobem em sequência */
.stag>*{opacity:0;transform:translateY(26px);
  transition:opacity .9s var(--ease-out),transform .9s var(--ease-out)}
.sec.on .stag>*,.stag.on>*{opacity:1;transform:none}
.stag>*:nth-child(1){transition-delay:.06s}
.stag>*:nth-child(2){transition-delay:.14s}
.stag>*:nth-child(3){transition-delay:.22s}
.stag>*:nth-child(4){transition-delay:.30s}
.stag>*:nth-child(5){transition-delay:.38s}
.stag>*:nth-child(6){transition-delay:.46s}

/* título com revelação por máscara — o texto sobe de dentro da linha */
.mask{display:block;overflow:hidden;padding-bottom:.08em}
.mask>span{display:block;transform:translateY(108%);
  transition:transform 1.05s .12s var(--ease-out)}
.sec.on .mask>span,.mask.on>span{transform:none}

/* reveal genérico */
.rv{opacity:0;transform:translateY(24px);
  transition:opacity .9s var(--ease-out),transform .9s var(--ease-out)}
.rv.on{opacity:1;transform:none}

@media (prefers-reduced-motion:reduce){
  html{scroll-behavior:auto}
  .rv,.stag>*,.mask>span,.sec--mist::before{opacity:1!important;transform:none!important;transition:none!important}
  .eyebrow::before{transform:scaleX(1)!important}
  *{animation:none!important}
}

/* ---- botões ---- */
.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:10px;
  padding:15px 30px;border-radius:100px;border:1px solid transparent;
  font-size:.92rem;font-weight:600;letter-spacing:.01em;
  transition:transform .4s var(--ease),box-shadow .4s var(--ease),background .4s var(--ease),border-color .4s var(--ease);
}
.btn svg{width:17px;height:17px;flex:none}
.btn--solid{background:var(--sage-deep);color:var(--porcelain)}
.btn--solid:hover{transform:translateY(-2px);box-shadow:0 18px 32px -18px rgba(68,82,59,.7)}
.btn--line{border-color:var(--line-strong);color:var(--ink)}
.btn--line:hover{border-color:var(--sage-deep);background:var(--sage-pale)}
.btn--pale{background:var(--porcelain);color:var(--sage-deep)}
.btn--pale:hover{transform:translateY(-2px);box-shadow:0 18px 32px -18px rgba(0,0,0,.45)}
.btn--lg{padding:18px 38px;font-size:1rem}
.btn:focus-visible,a:focus-visible,button:focus-visible{
  outline:2px solid var(--sage-deep);outline-offset:3px;border-radius:4px}

/* ---- marca do arco (divisor) ---- */
.arcmark{display:flex;justify-content:center;padding:0 22px}
.arcmark svg{width:78px;color:var(--sage);opacity:.55}
.arcmark path{stroke-dasharray:120;stroke-dashoffset:120;transition:stroke-dashoffset 1.4s var(--ease-out)}
.arcmark.on path{stroke-dashoffset:0}
.arcmark path:nth-child(2){transition-delay:.16s}
@media (prefers-reduced-motion:reduce){.arcmark path{stroke-dashoffset:0}}

/* ============================================================
   HEADER — sem menu hambúrguer.
   No celular fica só a marca e a ação que importa: agendar.
   ============================================================ */
.hdr{
  position:fixed;top:0;left:0;right:0;z-index:90;padding:18px 0;
  transition:padding .45s var(--ease),background .45s var(--ease),box-shadow .45s var(--ease);
}
.hdr.stuck{
  padding:11px 0;background:rgba(252,250,246,.9);
  -webkit-backdrop-filter:saturate(180%) blur(14px);backdrop-filter:saturate(180%) blur(14px);
  box-shadow:0 1px 0 var(--line);
}
.hdr .wrap{display:flex;align-items:center;justify-content:space-between;gap:16px}

/* fio de progresso da leitura — mostra onde você está entre as seções */
.prog{position:absolute;left:0;bottom:0;height:1.5px;background:var(--brass);
  width:0;opacity:0;transition:opacity .4s var(--ease)}
.hdr.stuck .prog{opacity:.9}

.logo{display:flex;flex-direction:column;line-height:1.12;min-width:0}
.logo b{font-family:'Cormorant Garamond',serif;font-weight:400;font-size:1.2rem;
  letter-spacing:.005em;white-space:nowrap}
.logo span{font-size:.55rem;font-weight:600;letter-spacing:.22em;text-transform:uppercase;
  color:var(--ink-faint);margin-top:3px}
@media(min-width:400px){.logo b{font-size:1.26rem}.logo span{font-size:.58rem}}

.nav{display:flex;align-items:center;gap:30px}
.nav a:not(.btn){display:none}
.nav .btn{padding:12px 22px;font-size:.83rem;white-space:nowrap}
.nav .btn svg{width:15px;height:15px}

@media(min-width:960px){
  .nav a:not(.btn){
    display:inline-block;font-size:.88rem;font-weight:500;color:var(--ink-soft);
    position:relative;transition:color .3s;
  }
  .nav a:not(.btn)::after{
    content:'';position:absolute;left:0;bottom:-5px;width:100%;height:1px;
    background:var(--sage-deep);transform:scaleX(0);transform-origin:right;
    transition:transform .45s var(--ease-out);
  }
  .nav a:not(.btn):hover{color:var(--sage-deep)}
  .nav a:not(.btn):hover::after{transform:scaleX(1);transform-origin:left}
  .nav .btn{padding:13px 26px;font-size:.86rem}
}

/* ============================================================
   HERO — a foto aparece UMA vez no site inteiro, aqui.
   ============================================================ */
.hero{padding:108px 0 0;position:relative;overflow:hidden}
@media(min-width:960px){.hero{padding:172px 0 40px}}
.hero .wrap{display:grid;gap:50px}
@media(min-width:960px){.hero .wrap{grid-template-columns:1.02fr .98fr;gap:64px;align-items:center}}

.hero-txt>*{opacity:0;transform:translateY(22px);animation:up 1s var(--ease-out) forwards}
.hero-txt>*:nth-child(1){animation-delay:.06s}
.hero-txt>*:nth-child(2){animation-delay:.18s}
.hero-txt>*:nth-child(3){animation-delay:.3s}
.hero-txt>*:nth-child(4){animation-delay:.42s}
@keyframes up{to{opacity:1;transform:none}}
.hero-txt h1{margin:18px 0 22px;max-width:13ch}
.hero-lede{font-size:1.06rem;color:var(--ink-soft);max-width:44ch;margin-bottom:34px}
.hero-cta{display:flex;flex-wrap:wrap;gap:12px}

.frame{position:relative;justify-self:center;width:100%;max-width:400px}
@media(min-width:960px){.frame{max-width:none}}
.frame-arch{
  position:relative;aspect-ratio:3/4;border-radius:var(--arch);overflow:hidden;
  background:var(--sage-pale);box-shadow:var(--shadow-soft);
  opacity:0;transform:scale(.95) translateY(18px);animation:up 1.2s .34s var(--ease-out) forwards;
}
.frame-arch img{width:100%;height:100%;object-fit:cover;object-position:50% 12%}
.depth{position:absolute;left:50%;bottom:-6%;width:150%;transform:translateX(-50%);
  color:var(--sage);opacity:.34;pointer-events:none;z-index:-1}
.depth path{fill:none;stroke:currentColor;stroke-width:1.1;
  stroke-dasharray:900;stroke-dashoffset:900;animation:draw 2.4s var(--ease-out) forwards}
.depth path:nth-child(1){animation-delay:.55s}
.depth path:nth-child(2){animation-delay:.77s}
.depth path:nth-child(3){animation-delay:.99s}
@keyframes draw{to{stroke-dashoffset:0}}
.crm-tag{
  position:absolute;right:6%;bottom:26px;background:var(--porcelain);border-radius:100px;
  padding:9px 18px;box-shadow:var(--shadow-soft);font-size:.7rem;font-weight:600;
  letter-spacing:.14em;text-transform:uppercase;color:var(--sage-deep);
  opacity:0;animation:up .8s 1s var(--ease-out) forwards;
}

.trust{border-top:1px solid var(--line);margin-top:62px}
.trust ul{display:grid;grid-template-columns:1fr}
@media(min-width:700px){.trust ul{grid-template-columns:repeat(3,1fr)}}
.trust li{padding:26px 0;display:flex;align-items:flex-start;gap:13px;border-bottom:1px solid var(--line)}
@media(min-width:700px){
  .trust li{border-bottom:none;padding:30px 26px 30px 0}
  .trust li+li{border-left:1px solid var(--line);padding-left:26px}
}
.trust svg{width:19px;height:19px;flex:none;color:var(--brass);margin-top:3px}
.trust b{display:block;font-size:.9rem;font-weight:600;margin-bottom:2px}
.trust p{font-size:.83rem;color:var(--ink-soft);line-height:1.5}

/* ============================================================
   SOBRE — sem foto: a tipografia carrega a seção
   ============================================================ */
.about-head{max-width:900px;margin:0 auto;text-align:center}
.about-head h2{margin:20px auto 0;max-width:15ch}
.pull{
  max-width:880px;margin:52px auto;padding:0 4px;text-align:center;
  font-family:'Cormorant Garamond',serif;font-style:italic;font-weight:300;
  font-size:clamp(1.55rem,1.1rem+2.1vw,2.6rem);line-height:1.24;color:var(--sage-deep);
}
.pull-rule{display:flex;justify-content:center;margin:34px 0}
.pull-rule i{width:52px;height:1px;background:var(--brass);display:block;
  transform:scaleX(0);transition:transform 1s var(--ease-out)}
.sec.on .pull-rule i{transform:scaleX(1)}

.about-cols{display:grid;gap:26px;max-width:900px;margin:0 auto}
@media(min-width:780px){.about-cols{grid-template-columns:1fr 1fr;gap:40px}}
.about-cols p{color:var(--ink-soft);font-size:.99rem}
.about-cols p+p{margin-top:20px}
.about-sign{text-align:center;margin-top:52px}
.about-sign b{font-family:'Cormorant Garamond',serif;font-style:italic;font-weight:400;
  font-size:1.6rem;color:var(--ink);display:block}
.about-sign span{font-size:.7rem;letter-spacing:.2em;text-transform:uppercase;color:var(--ink-faint)}

/* ============================================================
   EXAMES
   ============================================================ */
.head{max-width:620px;margin-bottom:52px}
.head h2{margin:18px 0 14px}
.head p{color:var(--ink-soft);font-size:1.02rem}

.exams{display:grid;border-top:1px solid var(--line)}
@media(min-width:760px){.exams{grid-template-columns:1fr 1fr}}
@media(min-width:1080px){.exams{grid-template-columns:repeat(4,1fr)}}
.exam{padding:36px 0;border-bottom:1px solid var(--line)}
@media(min-width:760px){
  .exam{padding:40px 30px 44px 0}
  .exam:nth-child(n+2){border-left:1px solid var(--line);padding-left:30px}
}
@media(min-width:1080px){.exam:nth-child(n+2){padding-left:32px}}
.exam-ico{width:42px;height:42px;color:var(--sage-deep);margin-bottom:22px;
  transition:transform .5s var(--ease),color .5s var(--ease)}
.exam:hover .exam-ico{transform:translateY(-3px);color:var(--brass)}
.exam h3{margin-bottom:12px}
.exam p{font-size:.92rem;color:var(--ink-soft)}
.exam-list{margin-top:16px;display:flex;flex-wrap:wrap;gap:7px}
.exam-list li{font-size:.72rem;letter-spacing:.03em;color:var(--sage-deep);
  background:var(--sage-pale);border-radius:100px;padding:5px 12px}
.sec--mist .exam-list li{background:var(--porcelain)}

/* ============================================================
   EXPERIÊNCIA
   ============================================================ */
.diffs{display:grid;gap:22px}
@media(min-width:700px){.diffs{grid-template-columns:1fr 1fr;gap:26px}}
.diff{
  background:var(--porcelain);border:1px solid var(--line);border-radius:20px;padding:32px 28px;
  transition:transform .5s var(--ease),box-shadow .5s var(--ease),opacity .9s var(--ease-out);
}
.diff:hover{transform:translateY(-4px);box-shadow:var(--shadow-soft)}
.diff svg{width:24px;height:24px;color:var(--brass);margin-bottom:20px}
.diff h3{font-size:1.14rem;margin-bottom:9px}
.diff p{font-size:.92rem;color:var(--ink-soft)}

/* ============================================================
   FAQ
   ============================================================ */
.faq{max-width:820px;margin:0 auto}
.faq-i{border-bottom:1px solid var(--line)}
.faq-i:first-child{border-top:1px solid var(--line)}
.faq-q{
  width:100%;background:none;border:none;text-align:left;padding:26px 2px;
  display:flex;align-items:flex-start;justify-content:space-between;gap:22px;
  font-family:'Cormorant Garamond',serif;font-weight:400;font-size:1.24rem;line-height:1.3;
  transition:color .3s;
}
.faq-i.open .faq-q,.faq-q:hover{color:var(--sage-deep)}
.faq-sign{flex:none;width:26px;height:26px;position:relative;margin-top:5px}
.faq-sign i{position:absolute;top:50%;left:50%;background:var(--sage-deep);
  transition:transform .45s var(--ease),opacity .45s var(--ease)}
.faq-sign i:nth-child(1){width:13px;height:1.4px;transform:translate(-50%,-50%)}
.faq-sign i:nth-child(2){width:1.4px;height:13px;transform:translate(-50%,-50%)}
.faq-i.open .faq-sign i:nth-child(2){transform:translate(-50%,-50%) rotate(90deg);opacity:0}
.faq-body{display:grid;grid-template-rows:0fr;transition:grid-template-rows .5s var(--ease)}
.faq-i.open .faq-body{grid-template-rows:1fr}
.faq-body>div{overflow:hidden}
.faq-a{padding:0 2px 28px;color:var(--ink-soft);font-size:.95rem;max-width:62ch}

/* ============================================================
   CTA + RODAPÉ
   ============================================================ */
.cta{background:var(--sage-deep);border-radius:26px;padding:62px 26px;text-align:center;
  position:relative;overflow:hidden;color:var(--porcelain)}
@media(min-width:900px){.cta{padding:96px 60px;border-radius:34px}}
.cta h2{color:var(--porcelain);max-width:17ch;margin:0 auto 20px}
.cta h2 .italic{color:var(--sage-pale)}
.cta p{color:rgba(252,250,246,.74);max-width:50ch;margin:0 auto 36px;font-size:1rem}
.cta-arc{position:absolute;left:50%;top:-42%;width:150%;transform:translateX(-50%);
  color:rgba(252,250,246,.12);pointer-events:none}
.cta-arc path{fill:none;stroke:currentColor;stroke-width:1.2;
  stroke-dasharray:1200;stroke-dashoffset:1200;transition:stroke-dashoffset 2s var(--ease-out)}
.cta.on .cta-arc path{stroke-dashoffset:0}
.cta-arc path:nth-child(2){transition-delay:.18s}
.cta-arc path:nth-child(3){transition-delay:.36s}
.cta-note{margin-top:26px;font-size:.78rem;color:rgba(252,250,246,.55)}

.foot{padding:54px 0 40px;border-top:1px solid var(--line)}
.foot .wrap{display:grid;gap:26px}
@media(min-width:820px){.foot .wrap{grid-template-columns:1fr 1.3fr;gap:60px;align-items:start}}
.foot-b b{font-family:'Cormorant Garamond',serif;font-weight:400;font-size:1.3rem;display:block}
.foot-b span{font-size:.72rem;letter-spacing:.18em;text-transform:uppercase;color:var(--ink-faint)}
.foot-links{display:flex;flex-wrap:wrap;gap:8px 20px;margin-top:20px}
.foot-links a{font-size:.86rem;color:var(--ink-soft);transition:color .3s}
.foot-links a:hover{color:var(--sage-deep)}
.foot-legal{font-size:.79rem;color:var(--ink-faint);line-height:1.6}
.foot-legal strong{display:block;color:var(--ink-soft);font-weight:600;margin-bottom:5px;
  font-size:.74rem;letter-spacing:.1em;text-transform:uppercase}
.foot-cr{margin-top:22px;font-size:.75rem;color:var(--ink-faint)}

/* botão flutuante de WhatsApp (mobile) */
.float{
  position:fixed;right:16px;bottom:16px;z-index:80;width:54px;height:54px;border-radius:50%;
  background:var(--sage-deep);color:var(--porcelain);display:flex;align-items:center;justify-content:center;
  box-shadow:var(--shadow-soft);opacity:0;transform:translateY(14px) scale(.9);pointer-events:none;
  transition:opacity .45s var(--ease),transform .45s var(--ease);
}
.float.on{opacity:1;transform:none;pointer-events:auto}
.float svg{width:25px;height:25px}
@media(min-width:960px){.float{display:none}}
</style>
</head>
<body>
<div id="root"></div>

<script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
<script src="https://unpkg.com/htm@3.1.1/dist/htm.js" crossorigin></script>

<script>
const html = htm.bind(React.createElement);
const { useState, useEffect, useRef } = React;

/* ===== CONFIGURAÇÃO — troque pelo WhatsApp real da clínica ===== */
const WHATSAPP = "5579900000000";                    /* TODO */
const wa = (m) => `https://wa.me/${WHATSAPP}?text=${encodeURIComponent(m)}`;

/* ===== observador de entrada ===== */
function useReveal(threshold=.15){
  const ref = useRef(null);
  const [on,setOn] = useState(false);
  useEffect(()=>{
    const el = ref.current;
    if(!el) return;
    if(typeof IntersectionObserver === "undefined"){ setOn(true); return; }
    const o = new IntersectionObserver(es=>es.forEach(e=>{
      if(e.isIntersecting){ setOn(true); o.unobserve(e.target); }
    }),{threshold, rootMargin:"0px 0px -8% 0px"});
    o.observe(el);
    return ()=>o.disconnect();
  },[]);
  return [ref,on];
}

/* Seção: dispara a faixa de fundo + a cascata dos filhos de uma vez.
   É isso que cria a transição entre uma seção e a próxima. */
function Sec({id,mist=false,cls="",children}){
  const [ref,on] = useReveal(.1);
  return html`<section id=${id} ref=${ref}
    class=${`sec ${mist?"sec--mist":""} ${cls} ${on?"on":""}`}>${children}</section>`;
}
function Rv({as="div",cls="",delay=0,style={},children}){
  const [ref,on] = useReveal();
  const T = as;
  return html`<${T} ref=${ref} className=${`rv ${cls} ${on?"on":""}`}
    style=${{transitionDelay:on?`${delay}ms`:"0ms",...style}}>${children}<//>`;
}
/* título com revelação por máscara */
function Mask({children}){
  return html`<span class="mask"><span>${children}</span></span>`;
}

/* ===== HEADER — sem hambúrguer ===== */
const MENU = [["#sobre","A médica"],["#exames","Exames"],

function Header(){
  const [stuck,setStuck] = useState(false);
  const [pct,setPct] = useState(0);
  useEffect(()=>{
    const f = ()=>{
      const y = window.scrollY;
      setStuck(y>24);
      const h = document.documentElement.scrollHeight - window.innerHeight;
      setPct(h>0 ? Math.min(100,(y/h)*100) : 0);
    };
    f(); window.addEventListener("scroll",f,{passive:true});
    window.addEventListener("resize",f);
    return ()=>{window.removeEventListener("scroll",f);window.removeEventListener("resize",f)};
  },[]);

  return html`<header class=${`hdr ${stuck?"stuck":""}`}>
    <div class="wrap">
      <a href="#inicio" class="logo"><b>Dra. Carla Thawanne</b><span>Ultrassonografia</span></a>
      <nav class="nav">
        ${MENU.map(([h,l])=>html`<a key=${h} href=${h}>${l}</a>`)}

           href=${wa("Olá, Dra. Carla! Gostaria de agendar um exame.")}>${I.zapp} Agendar</a>
      </nav>
    </div>
    <div class="prog" style=${{width:pct+"%"}}></div>
  </header>`;
}
